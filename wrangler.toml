name = "bitcoin-scalping-bot"
main = "worker/index.js"
compatibility_date = "2026-11-08"

[triggers]
crons = ["* * * * *"]


[[durable_objects.bindings]]
name = "BTC_LEARNING"
class_name = "BitcoinLearning"

[[migrations]]
tag = "btc-learning-v1"
new_sqlite_classes = ["BitcoinLearning"]

[[durable_objects.bindings]]
name = "BTC_BREAKOUT"
class_name = "BitcoinBreakout"

[[migrations]]
tag = "btc-breakout-v1"
new_sqlite_classes = ["BitcoinBreakout"]
